[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laga"
version = "0.1.0"
description = "Lease Agreement Guard Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jsonschema>=4.23,<5", "python-multipart>=0.0.20,<1", "tzdata>=2025.2"]
test = ["httpx>=0.28,<1", "pypdf>=6,<7"]

[project.scripts]
laga-api = "laga.api:main"
laga-create-user = "laga.backend_api:main"

[tool.setuptools.packages.find]
where = ["src"]
